# 改模型请改 models.yml，然后跑 `npm run generate`。
# 元数据实测日期：Fri Oct 16 2026 08:00:00 GMT+0800 (中国标准时间)（scripts/probe.mjs）

# 1) 自己的空壳行：让本包出现在「设置 → 插件 → 插件列表」
- insert:
    - id: '@dsh-ark-agent/coding-plan'
      name: '@dsh-ark-agent/coding-plan'

# 2) 目标行覆盖：同插件 insert 第二行必然失败，覆盖是唯一可行的注入方式
#    （原因见 README「为什么只有一个 patch」）
